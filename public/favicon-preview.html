<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Favicon Preview</title>
  <style>
    body { background: #22272e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; gap: 32px; }
    h2 { color: #adbac7; margin: 0; font-size: 14px; letter-spacing: 0.05em; }
    .row { display: flex; align-items: flex-end; gap: 24px; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    label { color: #768390; font-size: 11px; }
    svg.icon { overflow: visible; }
    .bg-light { background: #fff; padding: 8px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  </style>
</head>
<body>
  <h2>Favicon Preview</h2>
  <div class="row">
    <div class="item">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16"><rect width="32" height="32" rx="7" fill="#22272e"/><line x1="4" y1="22" x2="28" y2="22" stroke="#444c56" stroke-width="0.75"/><line x1="4" y1="15" x2="28" y2="15" stroke="#444c56" stroke-width="0.75"/><polygon points="4,26 4,20 10,16 16,18 22,10 28,7 28,26" fill="#539bf5" fill-opacity="0.12"/><polyline points="4,20 10,16 16,18 22,10 28,7" fill="none" stroke="#539bf5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="7" r="2.8" fill="#57ab5a"/></svg>
      <label>16×16</label>
    </div>
    <div class="item">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"><rect width="32" height="32" rx="7" fill="#22272e"/><line x1="4" y1="22" x2="28" y2="22" stroke="#444c56" stroke-width="0.75"/><line x1="4" y1="15" x2="28" y2="15" stroke="#444c56" stroke-width="0.75"/><polygon points="4,26 4,20 10,16 16,18 22,10 28,7 28,26" fill="#539bf5" fill-opacity="0.12"/><polyline points="4,20 10,16 16,18 22,10 28,7" fill="none" stroke="#539bf5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="7" r="2.8" fill="#57ab5a"/></svg>
      <label>32×32</label>
    </div>
    <div class="item">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64"><rect width="32" height="32" rx="7" fill="#22272e"/><line x1="4" y1="22" x2="28" y2="22" stroke="#444c56" stroke-width="0.75"/><line x1="4" y1="15" x2="28" y2="15" stroke="#444c56" stroke-width="0.75"/><polygon points="4,26 4,20 10,16 16,18 22,10 28,7 28,26" fill="#539bf5" fill-opacity="0.12"/><polyline points="4,20 10,16 16,18 22,10 28,7" fill="none" stroke="#539bf5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="7" r="2.8" fill="#57ab5a"/></svg>
      <label>64×64</label>
    </div>
    <div class="item">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128"><rect width="32" height="32" rx="7" fill="#22272e"/><line x1="4" y1="22" x2="28" y2="22" stroke="#444c56" stroke-width="0.75"/><line x1="4" y1="15" x2="28" y2="15" stroke="#444c56" stroke-width="0.75"/><polygon points="4,26 4,20 10,16 16,18 22,10 28,7 28,26" fill="#539bf5" fill-opacity="0.12"/><polyline points="4,20 10,16 16,18 22,10 28,7" fill="none" stroke="#539bf5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="7" r="2.8" fill="#57ab5a"/></svg>
      <label>128×128</label>
    </div>
  </div>
  <h2>On light background</h2>
  <div class="row">
    <div class="bg-light">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"><rect width="32" height="32" rx="7" fill="#22272e"/><line x1="4" y1="22" x2="28" y2="22" stroke="#444c56" stroke-width="0.75"/><line x1="4" y1="15" x2="28" y2="15" stroke="#444c56" stroke-width="0.75"/><polygon points="4,26 4,20 10,16 16,18 22,10 28,7 28,26" fill="#539bf5" fill-opacity="0.12"/><polyline points="4,20 10,16 16,18 22,10 28,7" fill="none" stroke="#539bf5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="7" r="2.8" fill="#57ab5a"/></svg>
      <label style="color:#888">32×32</label>
    </div>
    <div class="bg-light">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64"><rect width="32" height="32" rx="7" fill="#22272e"/><line x1="4" y1="22" x2="28" y2="22" stroke="#444c56" stroke-width="0.75"/><line x1="4" y1="15" x2="28" y2="15" stroke="#444c56" stroke-width="0.75"/><polygon points="4,26 4,20 10,16 16,18 22,10 28,7 28,26" fill="#539bf5" fill-opacity="0.12"/><polyline points="4,20 10,16 16,18 22,10 28,7" fill="none" stroke="#539bf5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="7" r="2.8" fill="#57ab5a"/></svg>
      <label style="color:#888">64×64</label>
    </div>
  </div>
</body>
</html>
